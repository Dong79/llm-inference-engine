name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libpcre2-dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers tokenizers safetensors openai aiohttp numpy

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4

      - name: Run tests
        run: tests/run_all.sh build